name: Release APK

# Tag a release and this builds the signed APK and publishes it.
#
#   git tag v1.7.1 && git push origin v1.7.1
#
# Requires four repository secrets for signing (Settings -> Secrets and
# variables -> Actions), plus the Firebase ones below:
#
#   ANDROID_KEYSTORE_BASE64    base64 -w0 < your-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# The keystore itself is deliberately not in the repo. Keep the original
# backed up somewhere safe - lose it and you can never update the Play
# listing for this application id again.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, e.g. v1.7.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      # A tag that disagrees with the version inside the APK ships a build
      # labelled one thing and reporting another, which is impossible to
      # untangle later from a bug report. Catch it before anything is built.
      - name: Check the tag matches versionName
        run: |
          GRADLE_VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          if [ "$GRADLE_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag is ${{ steps.ver.outputs.tag }} but android/app/build.gradle says versionName \"$GRADLE_VERSION\". Bump versionName and versionCode, commit, then re-tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build web assets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      # Absent, the google-services plugin quietly does not apply and the APK
      # builds fine but sign-in and push do nothing at runtime - exactly the
      # kind of failure that only shows up on a real device.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. The APK would build without Firebase, so sign-in and push would silently do nothing."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to publish an unsigned APK."
            exit 1
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          # storeFile resolves against android/, which is the Gradle root project here.
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/keystore.properties

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      # A build that silently fell back to unsigned is worse than a failed one:
      # it installs on the developer's phone and then refuses to upgrade anyone
      # who already has a properly signed copy.
      - name: Verify the APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Package artifacts
        id: pkg
        run: |
          V="${{ steps.ver.outputs.tag }}"
          cp android/app/build/outputs/apk/release/app-release.apk "rungs-${V}.apk"
          (cd dist && zip -qr "../rungs-${V}-pwa.zip" .)
          ls -lh rungs-*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.tag }}"
          gh release create "$V" \
            "rungs-${V}.apk" \
            "rungs-${V}-pwa.zip" \
            --title "Rungs ${V}" \
            --generate-notes

      # Keeps the signing material out of any cached or uploaded layer, even
      # though the runner is torn down anyway.
      - name: Scrub secrets from the workspace
        if: always()
        run: rm -f android/keystore/release.jks android/keystore.properties android/app/google-services.json
