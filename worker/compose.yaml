# Rungs reminder worker.
#
# Sends window reminders to installed web apps (PWA), which - unlike the
# Android build - can't schedule their own notifications while closed.
#
# Setup:
#   1. Firebase Console > Project settings > Service accounts >
#      "Generate new private key". Save it next to this file as
#      service-account.json (it is gitignored; it must never be committed).
#   2. docker compose up -d
#
# Check it's alive:   docker compose logs -f
# Dry run one tick:   docker compose run --rm worker node index.js --once
services:
  worker:
    build: .
    container_name: rungs-push
    restart: unless-stopped
    environment:
      # How often to look for due windows. The worker treats a window as due
      # when its nudge moment falls inside the next tick, so this value and
      # the real interval must agree.
      TICK_MINUTES: 5
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/service-account.json
    volumes:
      # Read-only: the worker never writes to the key.
      - ./service-account.json:/run/secrets/service-account.json:ro
    # No ports published - the worker only makes outbound calls, so it needs
    # no inbound access and shouldn't be reachable from the network.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
