<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#161826" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Rungs</title>
    <!-- Put the saved colour theme on before the stylesheet paints anything.
         Waiting for the app to boot would flash the default theme on every
         launch. Mirrors storedTheme() in src/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('rungs.theme');
        if (t && t !== 'violet' && /^[a-z]+$/.test(t)) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
